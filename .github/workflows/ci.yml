name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-2025"]
    runs-on: ${{ matrix.os }}
    needs:
      - format
      - scalafix
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3
      with:
        jvm: corretto:25
    - name: Test
      if: runner.os != 'Windows'
      run: ./mill __.compile && ./mill __.test
    # the mill shell launcher doesn't support Windows, use mill.bat there
    - name: Compile (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./mill.bat __.compile
    - name: Test (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./mill.bat __.test

  format:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: VirtusLab/scala-cli-setup@v1
      - run: scala-cli fmt . --check

  scalafix:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: coursier/cache-action@v8
      - uses: coursier/setup-action@v3
        with:
          jvm: corretto:25
      - name: Run scalafix
        run: ./mill -i __.fix --check

  publish:
    if: github.event_name == 'push'
    needs:
      - test
      - format
      - scalafix
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3
      with:
        jvm: corretto:25
    - name: Release
      run: ./mill -i mill.scalalib.SonatypeCentralPublishModule/
      env:
        MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY }}
        MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
        MILL_SONATYPE_USERNAME: ${{ secrets.PUBLISH_USER }}
        MILL_SONATYPE_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
